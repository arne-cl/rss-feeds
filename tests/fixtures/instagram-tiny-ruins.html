<script type="application/json"  data-content-len="23241" data-sjs>{"require":[["ScheduledServerJS","handle",null,[{"__bbox":{"require":[["RelayPrefetchedStreamCache","next",[],["adp_PolarisLoggedOutDesktopWWWProfilePostsTabContentQueryRelayPreloader_6abe596616a902b97128212",{"__bbox":{"complete":true,"result":{"data":{"xig_user_by_username":{"pk":"3075666469","polaris_ordered_timeline_connection":{"edges":[{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","pk":"3992549636757360569","code":"DdoYr2_CY-5","accessibility_caption":"Photo by Luke Hansbury on September 23, 2026.","caption":{"text":"TOTD 67 - Museum\n\nTiny Ruins - Me At The Museum [Bella Union]\nhttps:\/\/youtu.be\/Fj-JRE2Upt4?si=vnJTohQhA8XqP1mU\n[ TOTD Playlist link in bio ]\n\nSo so lovely. \u0040tiny_ruins are one of the very best ways to start a sunny festival day, in my case, \u0040endoftheroad 2018 (see second pic - I'm somewhere about four back from the front). Later that very same day at the same stage I incurred a crowdsurfing injury at \u0040thee_oh_sees... off to Salisbury Hospital to get patched up then back onsite to \u0040feistmusic on the Sunday to close out the festival. Normal.\n\nOut to Helen, Nicole, Dave and all the EOTR crew. One of the best festivals in the world IMO \u2764\ufe0f\n\n(main pic is of my favourite museum, The Natural History Museum in London)"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-2.cdninstagram.com\/v\/t51.82787-15\/796332393_18620613574049613_423677937161114222_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=107&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=-H1U68p_2jsQ7kNvwGywONy&_nc_oc=AdoWRZA8Uy-qQDl7UTpa63hmEcyULcD2T5uMyUPrx4HRDUltBpBe3yIz99T4vao_MoU&_nc_zt=23&_nc_ht=scontent-fra3-2.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMMKbfMjzwDcctkYngTH5WlDKkgsqtjHKCPCZOarNOQkA&oe=6AC447DA","media_type":8,"product_type":"carousel_container","user":{"pk":"465713612","username":"lukehandsfree","id":"17841401488367276"},"carousel_media_count":2,"id":"POLARIS_3992549636757360569"},"cursor":"AQHT2hPX2oS5xy0N67iNR8WT112RKfYy92wxxS3C4Nhqum5GdnTotEKz5rydxH0GWiFhPpBvfjYVwyCfA3LE0fmLxw"},{"node":{"__typename":"XIGPolarisVideoMedia","__isXIGPolarisMedia":"XIGPolarisVideoMedia","pk":"3847009738765228066","code":"DVjUvmekdgi","accessibility_caption":"Video by Ally Records on March 06, 2026.","caption":{"text":"Happy #BandcampFriday! The remastered version of Robert Scott\u2019s ~The Green House~ released on vinyl for the first time in the US is available in stores today! And, we have limited edition copies on our \u0040Bandcamp site while supplies last.\u2728\n \nSharing the video for \u201cLazy Boy,\u201d one of the stellar songs from the LP featuring Hollie (\u0040tiny_ruins ) singing with \u0040robertscottnz. Many thanks to \u0040pjsykes for skillfully remixing the original video, integrating the remastered audio. \ud83d\ude4f\ud83c\udffc\n\n.\n.\n.\n\n#TheGreenHouse\n\u0040flyingnun \n#DunedinSound\n#PortChalmers\n\u0040thebatsnz \n#TheClean"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra5-1.cdninstagram.com\/v\/t51.71878-15\/626277993_1338277208336461_7707843385888839078_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=109&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ\u00253D\u00253D&_nc_ohc=9hun1drnkVwQ7kNvwEIr1p8&_nc_oc=AdqyoWxkdrZXEv7iPyWcrh67v6OJNTrEwTC6QA5zDoXeZNQdunsU2wECqL-1ek8W-dI&_nc_zt=23&_nc_ht=scontent-fra5-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMJ-SkckRVVXJSlL686jGEUKJE-baLD1W_cmXbHn6LNMw&oe=6AC410B0","media_type":2,"product_type":"clips","user":{"pk":"31846365328","username":"allyrecordsnc","id":"17841431839860795"},"id":"POLARIS_3847009738765228066"},"cursor":"AQHTwtBIo22WVSyuTL7znRZxBwrn8wjkggb823Lal2kXfiptuK3hrDDXBjIGEOaWDhYiBzBhWALiXiP4kVxeGZyWsQ"},{"node":{"__typename":"XIGPolarisVideoMedia","__isXIGPolarisMedia":"XIGPolarisVideoMedia","pk":"3709339922957971225","code":"DN6OQHLFa8Z","accessibility_caption":"Video by Roundhead Studios on August 28, 2025.","caption":{"text":"On Saturday night \u0040tiny_ruins gave us a beautiful rendition of Sparklers at the Infinity Sessions. Watch the full video now on YouTube (\u0040theinfinitysessions).\n\nThe MUFGAL series may have wrapped, but there\u2019s still plenty more to come stay tuned as we share more highlights from across two incredible weeks at Roundhead Studios.\n\n\ud83c\udfa5 \u0040sundaepictures\n\n#InfinitySessions #RoundheadStudios #TinyRuins #MUFGAL"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-1.cdninstagram.com\/v\/t51.82787-15\/540684697_18498955852070775_1326441555598468106_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=103&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ\u00253D\u00253D&_nc_ohc=5yXaEE-V9LEQ7kNvwGGYniZ&_nc_oc=Adp5-GpZtYbunkgCIv-ilfkXUi-2U20Y_m27tmUk2F50K2DssZrOeKex1DY78CAVylU&_nc_zt=23&_nc_ht=scontent-fra3-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMMAEomrZgMKvXdZJgwt8qnpp9Wetwlq2xknvdHsRsnjQ&oe=6AC416A9","media_type":2,"product_type":"clips","user":{"pk":"2112926774","username":"roundheadstudios","id":"17841402123244115"},"id":"POLARIS_3709339922957971225"},"cursor":"AQHTqnST8LYtug-FiMaaqnGf5MYUUeF2cD8fwiJkFnGI0OGiQvWDg0SbA7290lzX9Zsap6rO0NA8jS8XhUjQFuoWtw"},{"node":{"__typename":"XIGPolarisVideoMedia","__isXIGPolarisMedia":"XIGPolarisVideoMedia","pk":"3705376731388096601","code":"DNsJIFZYrBZ","accessibility_caption":"Video by The Others Way on August 23, 2025.","caption":{"text":"A rare blend of eloquent lyrical craft and explorative musicianship, the songs of Tiny Ruins have been treasured by crowds and critics for over a decade. See them in their magnificent duo format with Hollie Fullbrook and Cass Basil performing. \n\nThis will be a favourite at The Other's Way this year!\n\nTickets on sale now via Moshtix. Follow \u0040theotherswayfestival for all the festival updates.\n\n#TheOthersWay #TinyRuins #KRoad #VisitAuckland"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra5-1.cdninstagram.com\/v\/t51.82787-15\/537206587_18059029646594391_7690988805572975774_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=100&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ\u00253D\u00253D&_nc_ohc=BfCIwifWLegQ7kNvwEvh_QV&_nc_oc=Adq9YuL-I3urPxiS9YGq-qfBOvxVPNz64cyELSIaPZPg_ISUPpHDwt7lHqL1MJOMKEo&_nc_zt=23&_nc_ht=scontent-fra5-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMSdivZ5FHMFRXQuKxSUYXk9IS6QE3uRGW-kUtNX-rj8Q&oe=6AC42446","media_type":2,"product_type":"clips","user":{"pk":"47966658390","username":"theotherswayfestival","id":"17841447831725832"},"id":"POLARIS_3705376731388096601"},"cursor":"AQHTnYCpg4equ2tm5E_I12NPcQUzlTVsrjTE2ylxMavF-9D5ed5u6ACGQ_k-NZyd31-Xn_QJKbBHphnFI80-awJWFQ"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","pk":"3631828958834481716","code":"DJm2TIgTlo0","accessibility_caption":"Photo by Strange News Touring on May 13, 2025.","caption":{"text":"JESSICA PRATT NZ SUPPORT ACTS ANNOUNCED!\n\nMONDAY 9 JUNE - THE PIANO, CHRISTCHURCH with BEN WOODS\nTUESDAY 10 JUNE - MEOW NUI, WELLINGTON with BEN WOODS\nWEDNESDAY 11 JUNE - BRUCE MASON CENTRE, AUCKLAND with TINY RUINS \n\nTickets on sale now from Banished Music\n\nThe countdown is on for fans of beguiling Californian folk song writer Jessica Pratt and her incredible band, with three very special happening across Aotearoa in just under a month. \n\nLyttelton\u2019s own songsmith Ben Woods will be joining the bill both on Monday 9 June at The Piano in Christchurch and Tuesday 10 June at Wellington\u2019s newest venue Meow Nui, while the wonderful Tiny Ruins will perform as a duo on Wednesday 11 June at Auckland\u2019s Bruce Mason Centre. \n\nBen Woods has released two solo albums worth of acclaimed and \u201cornately gloomy songs\u201d (Tony Stamp, RNZ), Put and Dispeller. He has collaborated with everyone from his Lyttelton brethren Marlon Williams to A Handful Of Dust\u2019s Alastair Galbraith, with a uniquely sound drawing comparisons to the likes of Scott Walker, Sparklehorse, and even Tall Dwarfs. The Quietus praised Ben as being \u201ca weirdly accessible, creaky-yet-meticulous marvel,\u201d and we are excited to have him on the bill for the first two shows of the tour.\n\nPerforming at Jessica\u2019s Auckland show as the stripped back duo of songwriter Hollie Fullbrook and her longtime bandmate Cass Basil, this is a rare opportunity to catch Tiny Ruins during their recording phase, as they complete their follow-up to the masterful 2023 album Ceremony. The Guardian once wrote, \u201cFullbrook can, at times, sound more like Nick Drake than a thousand sensitive boys,\u201d and we are pinching ourselves that this extraordinary addition to the line-up is happening.\n\nBen Woods photo Izzie Austin | Tiny Ruins photo Si Moore | Jessica Pratt photo Samuel Hess"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-1.cdninstagram.com\/v\/t51.75761-15\/497962951_18000620495785165_8656842911519513439_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=106&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=E6KLe-OFHSUQ7kNvwHXpAS6&_nc_oc=AdpdYJcS1NwFPRuGbvVPTd0pwd8YjrDQaFvUJn2bwpyAqT3vU-lKWNfx1SaqleP4MMM&_nc_zt=23&_nc_ht=scontent-fra3-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQP8bU_fBp3R4Dr4-eR-BGjMYczNsBUppxKkH8btsk20EA&oe=6AC412C2","media_type":8,"product_type":"carousel_container","user":{"pk":"53581217164","username":"strangenewstouring","id":"17841453554927652"},"carousel_media_count":4,"id":"POLARIS_3631828958834481716"},"cursor":"AQHT9AMjISn-kNFslxhm_ZFFlBs931NUFN3Zf54PaKKYOBII40D4-Jd7dU35ZDwsPJZ3TiAdjUWA4XF9eHYajhvBgA"},{"node":{"__typename":"XIGPolarisImageMedia","__isXIGPolarisMedia":"XIGPolarisImageMedia","pk":"3547486386448373873","code":"DE7NBK1yhhx","accessibility_caption":"Photo by Tiny Ruins on January 17, 2025.","caption":{"text":"Rest in peace, David Lynch. Thank you for all the strange and incredible films, and for Twin Peaks. You put a lot of much-needed love out into the world, and its reverberations will keep going a long time. \n\nThank you for entrusting me with the smallest drop in the ocean of what you put your name to. Entering a concrete, modernist bunker, my heart thumping, David emerged from the darkness of the cinema - the seats in this photo, I think. He was in a suit, his hair immaculate. He shook my hand warmly, putting me at ease. He ushered me to the kitchen, making us both a coffee - \u201cthis is what I call an americano\u201d, he said. \u201cSo what might this recording be used for?\u201d he then asked. \u201cErm, it\u2019s for the Hunger Games soundtrack, potentially\u201d, I said. He smiled ever so slightly. \u201cThe only thing I know about the hunger games is right around lunchtime,\u201d he said.\n\nThank you for telling me about the human heart on a flight you were on, ahead of its transplant - \u201cthank god the wind was behind us\u201d... the Los Angeles dusk light you loved... for showing me your matchbook paintings, for saying a whole lot more besides, including \u201cSweet Mary Louise!\u201d quite a few times, in exclamation. \n\nThank you also to Dean Hurley. My heartfelt condolences to all David\u2019s family & friends."},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-2.cdninstagram.com\/v\/t51.82787-15\/625438682_18077890124604880_7847461626611776758_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=104&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=tm9Pq3eY9OwQ7kNvwGMj6f2&_nc_oc=Adrl5QpM3Y-RJ9R70PKlUuC0pr5RYMLHrSIh58CI8YvTcTtXKpJ20LWrGaXzes--X30&_nc_zt=23&_nc_ht=scontent-fra3-2.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMdA7kZqm_lu0smBrRIQmhKMQFwJrMUxGYMl4vQBbbdeg&oe=6AC42698","media_type":1,"product_type":"feed","user":{"pk":"3075666469","username":"tiny_ruins","id":"17841402954094458"},"id":"POLARIS_3547486386448373873"},"cursor":"AQHTrADkICjTzLPMXgGRD_3h9eCmhncTBNbSUWZuQx6_PocMTVguJAH54jbCoSb9bCWjjjIl62HGZzg70m28PCHygg"},{"node":{"__typename":"XIGPolarisVideoMedia","__isXIGPolarisMedia":"XIGPolarisVideoMedia","pk":"3485655552879475282","code":"DBfiUHuv7pS","accessibility_caption":"Video by Tiny Ruins on October 23, 2024.","caption":{"text":"'Earthly Things' from our live Ceremony Sessions series - recorded & filmed in Feb 2023 - finally sharing now.\n\nThank you to all involved in these sessions.\n\nFilm directed & edited by \u0040alexandergandar. Sound recorded, mixed and mastered by Tom Healy \u0040paquinsounds. Featuring bandmates \u0040cassbasil, \u0040acfreazy & \u0040paquinsounds. Made with the support of \u0040nzonairmusic."},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-1.cdninstagram.com\/v\/t51.71878-15\/500662502_9198624163571321_6546365406556972709_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=103&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ\u00253D\u00253D&_nc_ohc=2oJfkSPZYXUQ7kNvwEOnzmF&_nc_oc=Ado08JI_c8LC9h6RoXxOlG1WY0XhyTGPgPmD-fjWRZZepq7NG6lVM5DcpceWIOk8dv0&_nc_zt=23&_nc_ht=scontent-fra3-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQNsY2tqBpuNUeqD186u4VPYKeNOp0_4J5DJBrCHN8rLPQ&oe=6AC41236","media_type":2,"product_type":"clips","user":{"pk":"3075666469","username":"tiny_ruins","id":"17841402954094458"},"id":"POLARIS_3485655552879475282"},"cursor":"AQHTtWf_ovl9IH393S71qaPhQldn7UZJ0M7F6JkKr266I8moAsCt4kHgI-1f2_7rPS_p7XyXOQYfo5pj7P9MfaT4RQ"},{"node":{"__typename":"XIGPolarisVideoMedia","__isXIGPolarisMedia":"XIGPolarisVideoMedia","pk":"3485650069413735053","code":"DBfhEU2uKqN","accessibility_caption":"Video by Tiny Ruins on October 23, 2024.","caption":{"text":"'Diving & Soaring' from our live Ceremony Sessions series - recorded & filmed in Feb 2023 - finally got my a into g \/ rather belatedly sharing with you...\n\nThank you to all involved in these sessions, it was a long, hot day & this was our last take, with \u0040acfreazy rushed off to the airport. \n\nFilm directed & edited by \u0040alexandergandar.\nSound recorded, mixed & mastered by Tom Healy \u0040paquinsounds. \nFeaturing \u0040cassbasil on upright & \u0040paquinsounds on magical additions. \nMade with the support of \u0040nzonairmusic."},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-2.cdninstagram.com\/v\/t51.71878-15\/504175064_1391415925235378_7654026825858625479_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=104&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ\u00253D\u00253D&_nc_ohc=ONbGAT-aQ5oQ7kNvwEJ8nDa&_nc_oc=Adobggbsrrof-LkPwSGOcQlw9WwVmelOpAwaq1o4HnfZE1ru4HINPT8zjx7vhgPdEZc&_nc_zt=23&_nc_ht=scontent-fra3-2.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQOc2H2AWWRJennBpgf5tqhqOmR5A9XQV-Zg9NcHKPB9QQ&oe=6AC43B62","media_type":2,"product_type":"clips","user":{"pk":"3075666469","username":"tiny_ruins","id":"17841402954094458"},"id":"POLARIS_3485650069413735053"},"cursor":"AQHTvxfpPHHYv2Jm-C7JOCC4RDTws0iV3-o5eCf9E5OuUB3Q7V46j9OLfsCWp00ul0rl5V4pCGliWZ85QhUnYRaF-w"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","pk":"3381465932852226806","code":"C7tYVmjver2","accessibility_caption":"Photo by Tiny Ruins on June 02, 2024.","caption":{"text":"Tour starts this week - it\u2019s solo, but I have company! Waiting patiently for little pup to join our pack in mid August \u2764\ufe0f \n\n\u014ctepoti & \u014ctautahi, you\u2019re up first this week on Thurs and Fri, joined by \u0040keirawallacemusic at \u0040erricksvenue & \u0040mouseyindahousey at \u0040thepiano.nz.\n\nThe 4 previously announced Auckland shows have sold out, so we\u2019ve added one last early show at Lopdell House cinema, Titirangi. All 4 \u0040loemisfestival Wellington shows have sold out. Might still be some tickets for Morgan\u2019s? \n\nCan\u2019t wait to sing some songs for you.\nThanks to \u0040banishedfromtheuniverse for helping pull this together with my somewhat absent brain. \nHollie x"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-2.cdninstagram.com\/v\/t51.82787-15\/652391796_18006984185704265_8492115006909329495_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=107&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=SxHEZKHy9SgQ7kNvwEOJpHB&_nc_oc=AdqGRD4K05uNUk3MsLzX6x3dypVT0CpNHZlroyHrJ_gdtqZUNsHh0J6RJtZ97vMrrUA&_nc_zt=23&_nc_ht=scontent-fra3-2.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQPtBSnPfwIbp1PSC0Q-w_26badBOBVg09flv1Rf3Nbbjw&oe=6AC434F7","media_type":8,"product_type":"carousel_container","user":{"pk":"3075666469","username":"tiny_ruins","id":"17841402954094458"},"carousel_media_count":3,"id":"POLARIS_3381465932852226806"},"cursor":"AQHTZzO5SoCJC80TCmixjy45Pbh6d17Jme_MCi5OMYVmMTNz3M0b3s8Uh5lECkgZfBPfZZgm-uHU_FBoQgu2RVEoCA"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","pk":"3348749545951412258","code":"C55Jfg4L0Ai","accessibility_caption":"Photo by Tiny Ruins on April 17, 2024.","caption":{"text":"We are so honoured to be amongst the finalists for Album of the Year & Best Group at the \u0040aotearoamusicawards. \n\n\u2018Ceremony\u2019 was a really beautiful time making music together, & I want to pay tribute to the band for putting their all into it - Cass, Basil, Alex Freer and Tom Healy. \nTom is also up for Best Producer for \u2018Ceremony\u2019 & Best Engineer for \u0040marlonwilliamssings \u2018My Boy\u2019. \nAwards are weird but we are really proud of this, alongside the Taite Prize nom too, so thank you, it means a lot. \n\nMassive mihi also to everyone who helped us record, release and tour \u2018Ceremony\u2019 ~\n\n\u0040milkrecords \n\u0040marathonartists \n\u0040badabingrecords \n\u0040kobaltmusic \n\u0040nzonairmusic \n\u0040independentmusicnz\n\u0040holidayrecords\n\u0040emilywsaudio \nalex corbett\nthe lab recording studio \n\u0040roundheadstudios \n\u0040icyforksart - album art \n\u0040alexandergandar & video teams\n\u0040francescarter - photography \n\u0040thelabelnz \n\u0040banishedfromtheuniverse \n\u0040nzmusiccommission \n\u0040playbookartists"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-1.cdninstagram.com\/v\/t51.82787-15\/660872659_18197842990342222_2387620501143042084_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=105&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=vn3H2XgEti0Q7kNvwFmmWL5&_nc_oc=Ado5Qv_RgPJ9tcFYkBHe7wHuC2y_44fYNClqAAS2xjk3ckDZQkOGPc8QeQhUTm6wBYw&_nc_zt=23&_nc_ht=scontent-fra3-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQNWdoCARnEnSOL_tgMENIJRCfjDb4X02edsKQMdWk2wOA&oe=6AC42560","media_type":8,"product_type":"carousel_container","user":{"pk":"3075666469","username":"tiny_ruins","id":"17841402954094458"},"carousel_media_count":10,"id":"POLARIS_3348749545951412258"},"cursor":"AQHTYNrx50VVuFK2oAXgXdHIaHxn_FoV30tXtbtuT3BBc0kjFBH4NHYegdXoxPRZpFVoGB8tVkCeQHM9gEX0UIVj9Q"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","pk":"3346265635260316687","code":"C5wUt2xybwP","accessibility_caption":"Photo by Banished Music on April 14, 2024.","caption":{"text":"This winter presents a rare opportunity to see Hollie Fullbrook performing as Tiny Ruins solo, playing a collection of songs from her illustrious back catalogue including the acclaimed 2023 release Ceremony, nominated as a finalist for both the 2024 Taite Prize and Silver Scroll award.\n\nTiny Ruins (solo ) - Winter Tour\nJune 6 - Erricks, Dunedin\nJune 7 - The Piano, Christchurch\nJune 14 - L\u014demis Festival \u0040 The Begonia House, Wellington \nJune 15 - Morgan\u2019s Clubhouse, P\u0101uatahanui \nJune 27 - Lopdell House, Titirangi\nJune 29 & 30 - Freida Margolis, Auckland\n\nA rare blend of eloquent lyrical craft and explorative musicianship, the songs of Tiny Ruins have been treasured by crowds and critics for over a decade. Via an eclectic raft of influences, the musical world of Hollie Fullbrook and band spans delicate folk, lustrous dream pop and ebullient psychedelia.\n\n\u201cFullbrook\u2019s hushed yet forceful songs, packed with obsessives and resilient loners, demand your full attention.\u201d \u2014 Q Magazine\n\nTIckets from tinyruins.com\nOn sale 10am, Wednesday 17th April\n\nBeautiful artwork as ever by \u0040anns_taylor_design"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent-fra3-1.cdninstagram.com\/v\/t39.30808-6\/438327754_18341685451106566_472564150130132222_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=101&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=q1igBaT-dYMQ7kNvwFqCb77&_nc_oc=AdoWR6oI-liVMwG2A7pHucH6uU5KyXgbESRVxUfaIHK9AR7quFRh-pFsRPMMHbhnQV4&_nc_zt=23&_nc_ht=scontent-fra3-1.cdninstagram.com&_nc_gid=kcniLo8DTNY7hM-U8cwsMg&_nc_ss=7b689&oh=00_AQMqpL6Cd-Djr9KvVk0TTi18NbHIzd-WzTRw7L7_jZ6pAw&oe=6AC42C6A","media_type":8,"product_type":"carousel_container","user":{"pk":"3313554565","username":"banishedfromtheuniverse","id":"17841403196974194"},"carousel_media_count":3,"id":"POLARIS_3346265635260316687"},"cursor":"AQHTvojIwVETRxga6DIJtAamNS0oX6p7r5latqh06JNEvysO6g--Ew7XK6GqK6qeTvV9ZOTIUtQ2JuKL2w-uRZZPzQ"},{"node":{"__typename":"XIGPolarisImageMedia","__isXIGPolarisMedia":"XIGPolarisImageMedia","pk":"3253045520216449607","code":"C0lI6pOrWJH","accessibility_caption":"Photo by Tiny Ruins on December 07, 2023.","caption":{"text":"Get along to this tomorrow if you\u2019re in T\u0101maki, lovely people! \ud83d\udc9a\u2764\ufe0f\ud83d\udda4\ud83e\udd0d An exhibition by Palestinian artists, alongside a participatory art installation (the making of pap
