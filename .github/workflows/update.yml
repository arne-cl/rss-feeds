name: Update feeds

on:
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feeds
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python scripts/build_quora_feed.py
          python scripts/build_klum_feed.py
          # Instagram is the flakiest source; don't let it block the others
          python scripts/build_instagram_feed.py tiny_ruins \
            || echo "::warning::Instagram feed build failed"

      - name: Commit feeds if changed
        run: |
          if [[ -n "$(git status --porcelain feeds)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "Update feeds [skip ci]"
            git push
          else
            echo "No changes"
          fi
