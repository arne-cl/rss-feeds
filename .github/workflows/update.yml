name: Update feeds

on:
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feeds
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python scripts/build_quora_feed.py
          python scripts/build_klum_feed.py
          python scripts/build_brf_chansons_feed.py
          # All builders record soft failures (fetch, jina fallback, unparseable
          # page) as a rolling "Feed build failed" item inside their feed and
          # emit a ::warning:: annotation, so one flaky source neither blocks
          # the other feeds nor fails the workflow.
          for account in tiny_ruins kultur_bei_racha_roger martinmaleschka tumvlt jamborjoanna; do
            python scripts/build_instagram_feed.py "$account"
          done

      - name: Commit feeds if changed
        run: |
          if [[ -n "$(git status --porcelain feeds)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "Update feeds [skip ci]"
            git push
          else
            echo "No changes"
          fi
